<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library · College ERP</title><script src="config.js"></script><link rel="stylesheet" href="erp-ui.css"></head><body><main class="module-page"><header class="module-header"><div><p class="eyebrow">Library</p><h1>Catalog &amp; loans</h1><p>Search the catalog, review availability and manage authorized reservations.</p></div><button class="primary-btn" onclick="location.href='dashboard.html'">Back to dashboard</button></header><section class="section-card filters"><input id="search" placeholder="Search title or ISBN"><button class="primary-btn" onclick="load()">Search</button></section><section id="message" class="state">Loading catalog…</section><section id="catalog" class="module-list"></section><section class="section-card"><h2>My loans</h2><div id="loans" class="state">Loading loans…</div></section></main><script>
const token=sessionStorage.getItem('token')||localStorage.getItem('token');const role=localStorage.getItem('role')||sessionStorage.getItem('role');if(!token)location.href='login.html';const auth={Authorization:'Bearer '+token};const $=id=>document.getElementById(id);async function call(url,opt={}){const r=await fetch(API_BASE+url,{...opt,headers:{...auth,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d}async function load(){try{const d=await call('/api/library/catalog?search='+encodeURIComponent($('search').value));$('message').hidden=true;$('catalog').innerHTML=d.items.length?d.items.map(b=>`<article class="section-card"><div class="module-row"><div><p class="eyebrow">${b.category_name||'Catalog item'}</p><h2>${b.title}</h2><p>${b.publisher||'Publisher unavailable'} · ${b.available}/${b.copies} available</p></div><button class="primary-btn" onclick="reserve(${b.id})">Reserve</button></div>${b.digital_storage_key?`<button class="secondary-btn" onclick="downloadBook(${b.id})">Download digital resource</button>`:''}</article>`).join(''):'<div class="state">No catalog items matched your search.</div>'}catch(e){$('message').textContent=e.message}if(role==='student')try{const loans=await call('/api/library/my-loans');$('loans').innerHTML=loans.length?loans.map(l=>`<p><strong>${l.title}</strong> · Due ${l.due_at} · ${l.status}</p>`).join(''):'No loans found.'}catch(e){$('loans').textContent=e.message}else $('loans').textContent='Loan history is available to students.'}async function reserve(id){try{const d=await call('/api/library/books/'+id+'/reserve',{method:'POST'});alert(`Reservation status: ${d.status}`);load()}catch(e){alert(e.message)}}async function downloadBook(id){const r=await fetch(API_BASE+'/api/library/books/'+id+'/download',{headers:auth});if(!r.ok){alert((await r.json()).message||'Download unavailable');return}const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='library-resource';a.click();URL.revokeObjectURL(a.href)}load();</script></body></html>
