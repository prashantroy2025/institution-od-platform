<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance · College ERP</title><script src="config.js"></script><link rel="stylesheet" href="erp-ui.css"></head><body><main class="module-page"><header class="module-header"><div><p class="eyebrow">Finance</p><h1>Fees &amp; payments</h1><p>Real invoice balances and verified payment status. Gateway payments are disabled until configured.</p></div><button class="primary-btn" onclick="location.href='dashboard.html'">Back to dashboard</button></header><section id="message" class="state">Loading invoices…</section><section id="invoices" class="module-list"></section><section id="statement" class="section-card" hidden></section></main><script>
const token=sessionStorage.getItem('token')||localStorage.getItem('token');const role=sessionStorage.getItem('role')||localStorage.getItem('role');if(!token)location.href='login.html';else if(role==='student')location.replace('fees.html');const auth={Authorization:'Bearer '+token};const $=id=>document.getElementById(id);async function call(url,opt={}){const r=await fetch(API_BASE+url,{...opt,headers:{...auth,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d}function paise(v){return '₹'+(Number(v||0)/100).toLocaleString('en-IN',{minimumFractionDigits:2})}async function load(){try{const d=await call('/api/finance/invoices');$('message').hidden=true;$('invoices').innerHTML=d.items.length?d.items.map(i=>`<article class="section-card"><div class="module-row"><div><p class="eyebrow">${i.invoice_no}</p><h2>${i.student_name||'My invoice'}</h2><p>Due ${i.due_date} · ${i.status}</p></div><strong>${paise(i.total_paise)}</strong></div><button class="primary-btn" onclick="showStatement(${i.id})">View statement</button>${i.status!=='Paid'&&role==='student'?`<button class="secondary-btn" onclick="pay(${i.id})">Submit offline payment</button>`:''}</article>`).join(''):'<div class="state">No invoices found for your authorized scope.</div>'}catch(e){$('message').textContent=e.message}}async function showStatement(id){try{const d=await call('/api/finance/invoices/'+id+'/statement');$('statement').hidden=false;$('statement').innerHTML=`<h2>${d.invoice.invoice_no} statement</h2><p>Outstanding: <strong>${paise(d.outstanding_paise)}</strong></p><h3>Payments</h3>${d.payments.length?d.payments.map(p=>`<p>${paise(p.amount_paise)} · ${p.method} · ${p.status}</p>`).join(''):'<div class="state">No payments recorded.</div>'}`}catch(e){alert(e.message)}}async function pay(id){const amount=prompt('Enter amount in paise.');if(!amount)return;try{const d=await call('/api/finance/payments',{method:'POST',headers:{...auth,'Content-Type':'application/json'},body:JSON.stringify({invoice_id:id,amount_paise:amount,method:'Offline'})});alert(`Payment submitted as ${d.status}. It requires authorized verification.`);load()}catch(e){alert(e.message)}}load();</script></body></html>
