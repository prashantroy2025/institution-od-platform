<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Attendance · College ERP</title><script src="config.js"></script><script src="ui-feedback.js"></script><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="erp-ui.css"></head><body class="erp-dashboard"><main class="module-page attendance-page"><header class="module-header"><div><p class="eyebrow">Academics</p><h1>My Attendance</h1><p id="summaryMeta">Loading authorized attendance records…</p></div><button class="primary-btn" onclick="location.href='dashboard.html'">Back to home</button></header><section class="section-card attendance-filters"><label>From <input id="from" type="date"></label><label>To <input id="to" type="date"></label><button class="primary-btn" onclick="load()">Apply filters</button></section><section id="state" class="state">Loading attendance…</section><div id="content" hidden><section class="attendance-overview"><div class="attendance-ring" id="percentage">—</div><div><p class="eyebrow">Overall attendance</p><h2 id="overallLabel">No records yet</h2><p id="thresholdLabel"></p></div><div class="attendance-stat"><strong id="present">0</strong><small>Present</small></div><div class="attendance-stat"><strong id="absent">0</strong><small>Absent</small></div><div class="attendance-stat"><strong id="late">0</strong><small>Late</small></div></section><section class="section-card"><div class="section-heading"><h2>Subject-wise attendance</h2><span class="muted-note">Excused counts as attended according to current attendance rules.</span></div><div id="subjects" class="attendance-subjects"></div></section><section class="section-card"><h2>Attendance history</h2><div id="history" class="attendance-history"></div></section></div></main><nav class="bottom-nav"><button data-bottom="home">⌂<br>Home</button><button data-bottom="messages">♡<br>Messages</button><button class="active" data-bottom="attendance">▦<br>Attendance</button><button data-bottom="profile">♙<br>Profile</button></nav>
<script>const token=sessionStorage.getItem('token')||localStorage.getItem('token');if(!token)location.href='login.html';const auth={Authorization:'Bearer '+token};const $=id=>document.getElementById(id);async function load(){const q=new URLSearchParams();if($('from').value)q.set('from',$('from').value);if($('to').value)q.set('to',$('to').value);try{const r=await fetch(API_BASE+'/api/attendance/summary?'+q,{headers:auth});const d=await r.json();if(!r.ok)throw Error(d.message||'Unable to load attendance');$('state').hidden=true;$('content').hidden=false;const o=d.overall;const range=[$('from').value,$('to').value].filter(Boolean).join(' to ');$('summaryMeta').textContent=`${o.total} record${o.total===1?'':'s'} across ${d.subjects.length} subject${d.subjects.length===1?'':'s'}${range?` · range ${range}`:''}`;$('percentage').textContent=o.percentage===null?'—':o.percentage+'%';$('overallLabel').textContent=o.total?`${o.total} classes recorded`:'No attendance records yet';$('thresholdLabel').textContent=o.percentage!==null&&o.percentage<d.threshold?'Low-attendance alert: below the configured '+d.threshold+'% threshold.':'No low-attendance alert for this range.';$('present').textContent=o.present;$('absent').textContent=o.absent;$('late').textContent=o.late;$('subjects').innerHTML=d.subjects.length?d.subjects.map(s=>`<div class="subject-row"><div><strong>${s.subject_name}</strong><small>${s.attended||0} attended of ${s.classes_held} held</small></div><strong>${s.percentage===null?'—':s.percentage+'%'}</strong></div>`).join(''):'<div class="state">No subject attendance records exist for this range.</div>';$('history').innerHTML=d.history.length?d.history.map(h=>`<div class="history-row"><span>${h.attendance_date}</span><strong>${h.subject_name}</strong><span class="status-${h.status.toLowerCase()}">${h.status}</span><small>${h.start_time||''} ${h.classroom_name||''}</small></div>`).join(''):'<div class="state">No attendance history exists for this range.</div>'}catch(e){$('state').textContent=e.message}}document.querySelectorAll('[data-bottom]').forEach(b=>b.onclick=()=>location.href=b.dataset.bottom==='home'?'dashboard.html':b.dataset.bottom==='messages'?'messages.html':b.dataset.bottom==='attendance'?'attendance.html':'profile.html');load();</script></body></html>
