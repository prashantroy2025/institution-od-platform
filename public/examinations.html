<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Examinations</title><link rel="stylesheet" href="erp-ui.css"><style>body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,sans-serif}.shell{max-width:1200px;margin:auto;padding:28px clamp(16px,4vw,54px)}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:16px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}label{font-size:12px;font-weight:700;color:#68758a}input,textarea,button{font:inherit;padding:10px;border:1px solid #ccd5e5;border-radius:9px}button{background:#315efb;color:#fff;border:0;cursor:pointer;font-weight:700}.secondary{background:#e8edff;color:#2449d8}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e4e9f2}@media(max-width:650px){.top{display:block}.top button{margin-top:12px;width:100%}}</style></head><body><main class="shell"><header class="top"><div><p style="color:#315efb;font-weight:800;text-transform:uppercase;font-size:12px">Academics</p><h1>Examinations &amp; results</h1><p>Registration, schedules, admit cards and published results.</p></div><button class="secondary" onclick="history.back()">Back</button></header><section class="card" id="adminBox"><h2>Create examination</h2><div class="grid"><label>Session ID<input id="session" type="number"></label><label>Semester ID<input id="semester" type="number"></label><label>Subject ID<input id="subject" type="number"></label><label>Batch ID<input id="batch" type="number"></label><label>Section ID<input id="section" type="number"></label><label>Title<input id="title"></label><label>Exam type<input id="type" value="End Semester"></label><label>Maximum marks<input id="max" type="number"></label><label>Pass marks<input id="pass" type="number"></label><label>Start<input id="start" type="datetime-local"></label><label>End<input id="end" type="datetime-local"></label><label>Room ID<input id="room" type="number"></label></div><p><label>Grading rules JSON<textarea id="rules">{"bands":[{"grade":"A","min_percent":80},{"grade":"B","min_percent":60},{"grade":"C","min_percent":40},{"grade":"F","min_percent":0}]}</textarea></label></p><button onclick="createExam()">Create draft</button><span id="message"></span></section><section class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2>Examinations</h2><button class="secondary" onclick="load()">Refresh</button></div><div id="list" class="table"></div></section><section class="card"><h2>My result</h2><div class="grid"><label>Exam ID<input id="resultId" type="number"></label><button onclick="result()">View published result</button></div><pre id="result"></pre></section></main><script src="config.js"></script><script>const token=sessionStorage.getItem('token')||localStorage.getItem('token'),role=sessionStorage.getItem('role')||localStorage.getItem('role'),auth={Authorization:'Bearer '+token};const $=id=>document.getElementById(id);async function call(url,opt={}){const r=await fetch(API_BASE+url,{...opt,headers:{...auth,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d}async function createExam(){try{const b={session_id:$('session').value,semester_id:$('semester').value,subject_id:$('subject').value,batch_id:$('batch').value,section_id:$('section').value,title:$('title').value,exam_type:$('type').value,maximum_marks:$('max').value,pass_marks:$('pass').value,scheduled_start:$('start').value,scheduled_end:$('end').value,room_id:$('room').value,grading_rules:$('rules').value};await call('/api/examinations',{method:'POST',headers:{...auth,'Content-Type':'application/json'},body:JSON.stringify(b)});$('message').textContent='Created';load()}catch(e){$('message').textContent=e.message}}async function load(){try{const d=await call('/api/examinations');$('list').innerHTML='<table><tr><th>Title</th><th>Subject</th><th>Schedule</th><th>Status</th><th>Actions</th></tr>'+d.items.map(e=>`<tr><td>${e.title}</td><td>${e.subject_name}</td><td>${e.scheduled_start||'Not scheduled'}</td><td>${e.status}</td><td>${role==='student'?`<button onclick="registerExam(${e.id})">Register</button> <button onclick="admit(${e.id})">Admit card</button>`:`<button onclick="seats(${e.id})">Seats</button>`}</td></tr>`).join('')+'</table>'}catch(e){$('list').textContent=e.message}}async function registerExam(id){try{await call('/api/examinations/'+id+'/register',{method:'POST',headers:auth});alert('Registration recorded; payment integration is not configured.')}catch(e){alert(e.message)}}async function admit(id){const r=await fetch(API_BASE+'/api/examinations/'+id+'/admit-card',{headers:auth});if(!r.ok){alert('Admit card unavailable');return}const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='admit-card.txt';a.click()}async function seats(id){try{alert(JSON.stringify(await call('/api/examinations/'+id+'/seats')))}catch(e){alert(e.message)}}async function result(){try{$('result').textContent=JSON.stringify(await call('/api/examinations/'+$('resultId').value+'/result'),null,2)}catch(e){$('result').textContent=e.message}}if(!token)location.href='login.html';if(role==='student')$('adminBox').style.display='none';load()</script></body></html>
