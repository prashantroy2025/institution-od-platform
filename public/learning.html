<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning · Campus ERP</title><link rel="stylesheet" href="erp-ui.css"><style>:root{--ink:#172033;--muted:#68758a;--line:#e4e9f2;--surface:#fff;--canvas:#f5f7fb;--blue:#315efb;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,system-ui,sans-serif}.shell{max-width:1220px;margin:auto;padding:28px clamp(16px,4vw,54px)}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.top h1{margin:0}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 30px #19315b0d;margin-bottom:18px}.filters,.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.field{display:grid;gap:5px;flex:1 1 170px}.field label{font-size:12px;font-weight:700;color:var(--muted)}input,textarea,select,button{font:inherit;padding:10px 12px;border:1px solid #ccd5e5;border-radius:9px}textarea{min-height:80px}button{cursor:pointer;border:0;background:var(--blue);color:#fff;font-weight:700}.secondary{background:#e8edff;color:#2449d8}.danger{color:var(--red)}.message{color:var(--muted);margin-top:12px}.table-wrap{overflow:auto;margin-top:18px}table{border-collapse:collapse;width:100%;min-width:780px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);text-transform:uppercase}.status{font-weight:700}@media(max-width:650px){.top{display:block}.top button{margin-top:12px;width:100%}.card{padding:14px}}</style></head><body><main class="shell"><header class="top"><div><p style="color:var(--blue);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12px">Academics</p><h1>Assignments &amp; learning materials</h1><p style="color:var(--muted)">Private, access-controlled academic files.</p></div><button class="secondary" onclick="history.back()">Back</button></header>
<section class="card" id="createBox"><h2>Create assignment</h2><div class="filters"><div class="field"><label>Subject ID</label><input id="subject" type="number" min="1"></div><div class="field"><label>Batch ID</label><input id="batch" type="number" min="1"></div><div class="field"><label>Section ID</label><input id="section" type="number" min="1"></div><div class="field"><label>Title</label><input id="title"></div><div class="field"><label>Publish at</label><input id="publish" type="datetime-local"></div><div class="field"><label>Deadline</label><input id="deadline" type="datetime-local"></div><div class="field"><label>Maximum marks</label><input id="marks" type="number" min="1"></div><div class="field"><label>Attachment</label><input id="attachment" type="file"></div></div><p><label>Instructions</label><textarea id="instructions"></textarea></p><button onclick="createAssignment()">Create draft</button><span id="message" class="message"></span></section>
<section class="card"><h2>Assignments</h2><div class="filters"><div class="field"><label>Search</label><input id="search"></div><div class="field"><label>Subject ID</label><input id="filterSubject" type="number"></div><button class="secondary" onclick="loadAssignments()">Refresh</button></div><div id="assignments" class="table-wrap"></div></section>
<section class="card"><h2>Learning materials</h2><div class="filters"><div class="field"><label>Subject ID</label><input id="materialSubject" type="number"></div><div class="field"><label>Title</label><input id="materialTitle"></div><div class="field"><label>Description</label><input id="materialDescription"></div><div class="field"><label>File</label><input id="materialFile" type="file"></div><button onclick="uploadMaterial()">Upload material</button><button class="secondary" onclick="loadMaterials()">Refresh</button></div><div id="materials" class="table-wrap"></div></section></main><script src="config.js"></script><script>
const token=localStorage.getItem('token'),role=localStorage.getItem('role');const auth={Authorization:'Bearer '+token};const $=id=>document.getElementById(id);const msg=t=>$('message').textContent=t;async function call(url,opt={}){const r=await fetch(API_BASE+url,{...opt,headers:{...auth,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d}function formData(fields,fileField){const f=new FormData();Object.entries(fields).forEach(([k,v])=>{if(v!==''&&v!==null)f.append(k,v)});if(fileField.files[0])f.append(fileField.id,fileField.files[0]);return f}
async function createAssignment(){try{const f=formData({subject_id:$('subject').value,batch_id:$('batch').value,section_id:$('section').value,title:$('title').value,instructions:$('instructions').value,publish_at:$('publish').value,deadline:$('deadline').value,max_marks:$('marks').value},$('attachment'));await call('/api/learning/assignments',{method:'POST',headers:auth,body:f});msg('Draft created. Publish through the assignment API when authorized.');loadAssignments()}catch(e){msg(e.message)}}
async function loadAssignments(){try{const p=new URLSearchParams();if($('search').value)p.set('search',$('search').value);if($('filterSubject').value)p.set('subject_id',$('filterSubject').value);const d=await call('/api/learning/assignments?'+p);$('assignments').innerHTML='<table><thead><tr><th>Title</th><th>Subject</th><th>Section</th><th>Deadline</th><th>Status</th><th>Action</th></tr></thead><tbody>'+d.items.map(a=>`<tr><td>${a.title}</td><td>${a.subject_name}</td><td>${a.section_name}</td><td>${a.deadline}</td><td class="status">${a.status}</td><td>${role==='student'?`<input type="file" id="file-${a.id}"><button onclick="submitWork(${a.id})">Submit</button>`:`<button onclick="viewSubmissions(${a.id})">Submissions</button> <button class="secondary" onclick="changeAssignmentStatus(${a.id},'${a.status==='Draft'?'Published':'Archived'}')">${a.status==='Draft'?'Publish':'Archive'}</button>`}</td></tr>`).join('')+'</tbody></table>'}catch(e){$('assignments').innerHTML=`<p class="danger">${e.message}</p>`}}
async function submitWork(id){try{const file=$('file-'+id);if(!file.files[0])throw Error('Choose a file first');const f=new FormData();f.append('file',file.files[0]);await call('/api/learning/assignments/'+id+'/submissions',{method:'POST',headers:auth,body:f});alert('Submission recorded');loadAssignments()}catch(e){alert(e.message)}}async function changeAssignmentStatus(id,status){try{await call('/api/learning/assignments/'+id,{method:'PATCH',headers:{...auth,'Content-Type':'application/json'},body:JSON.stringify({status})});loadAssignments()}catch(e){alert(e.message)}}async function viewSubmissions(id){try{const d=await call('/api/learning/assignments/'+id+'/submissions');if(!d.items.length){alert('No submissions');return}const selected=d.items[0],marks=prompt(`Marks for ${selected.student_name} (max ${d.assignment.max_marks})`,selected.marks??'');if(marks===null)return;const feedback=prompt('Feedback',selected.feedback||'')||'';const returned=confirm('Return this work for resubmission?');await call('/api/learning/submissions/'+selected.id+'/grade',{method:'PATCH',headers:{...auth,'Content-Type':'application/json'},body:JSON.stringify({marks,feedback,return_for_resubmission:returned})});alert('Submission updated')}catch(e){alert(e.message)}}
async function uploadMaterial(){try{const f=formData({subject_id:$('materialSubject').value,title:$('materialTitle').value,description:$('materialDescription').value},$('materialFile'));await call('/api/learning/materials',{method:'POST',headers:auth,body:f});loadMaterials()}catch(e){alert(e.message)}}async function loadMaterials(){try{const d=await call('/api/learning/materials');$('materials').innerHTML='<table><thead><tr><th>Title</th><th>Subject</th><th>Description</th><th>Download</th></tr></thead><tbody>'+d.items.map(m=>`<tr><td>${m.title}</td><td>${m.subject_name}</td><td>${m.description||'—'}</td><td><button onclick="download('/api/learning/materials/${m.id}/download','${m.original_name}')">Download</button></td></tr>`).join('')+'</tbody></table>'}catch(e){$('materials').innerHTML=`<p class="danger">${e.message}</p>`}}async function download(url,name){const r=await fetch(API_BASE+url,{headers:auth});if(!r.ok){alert('Download denied');return}const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href)}if(!token)location.href='login.html';if(role==='student')$('createBox').style.display='none';loadAssignments();loadMaterials();</script></body></html>
