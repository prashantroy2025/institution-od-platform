<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Achievement · College ERP</title>
<script src="config.js"></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="profile.css">
</head>
<body class="profile-body">
<div class="profile-app">

<header class="app-header">
    <div class="app-brand"><span class="brand-cap" aria-hidden="true">▲</span><strong>College ERP</strong></div>
</header>

<main class="page">
    <div class="page-top">
        <a class="back-link" id="backLink" href="profile-details.html?section=achievements" aria-label="Back to achievements">‹</a>
        <h1>Achievement</h1>
    </div>

    <p class="state" id="loading" role="status">Loading achievement…</p>

    <section class="card" id="errorCard" hidden>
        <p class="state error" role="alert" id="errorText"></p>
        <div style="margin-top:12px"><button class="secondary-btn" id="retryLoad" type="button">Retry</button></div>
    </section>

    <section class="card" id="detailCard" hidden aria-labelledby="detailTitle">
        <h2 id="detailTitle" class="identity-name"><span id="title">—</span></h2>
        <p><span class="status-pill">Self-reported</span> <span class="hint">Verification by the institution is not available yet.</span></p>
        <dl class="facts" style="margin-top:12px">
            <div><dt>Category</dt><dd id="category">—</dd></div>
            <div><dt>Organisation</dt><dd id="organization">—</dd></div>
            <div><dt>Date</dt><dd id="achievedOn">—</dd></div>
        </dl>
        <div style="margin-top:12px">
            <h3 style="margin:0 0 6px;font-size:15px">Description</h3>
            <p id="description" class="muted">No description added.</p>
        </div>
    </section>
</main>

<nav class="bottom-nav" aria-label="Main navigation"></nav>
</div>

<script src="erp-app.js"></script>
<script src="profile-achievement.js"></script>
</body>
</html>
