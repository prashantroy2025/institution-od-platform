<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Messages · College ERP</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="messages.css">
<script src="config.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="topBack" type="button" aria-label="Back to dashboard">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5-10-5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/></svg>
      <span>College ERP</span>
    </div>
    <button class="icon-btn bell" id="bellBtn" type="button" aria-label="Show unread messages">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      <span class="badge" id="bellBadge" hidden></span>
    </button>
    <button class="top-avatar" id="topAvatar" type="button" aria-label="Open profile">CE</button>
  </header>

  <main class="sheet">
    <div class="sheet-head">
      <button class="icon-btn back-arrow" id="sheetBack" type="button" aria-label="Back to dashboard">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1>Messages</h1>
      <button class="icon-btn new-btn" id="newMessageBtn" type="button" aria-label="New message" aria-haspopup="dialog">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 8v5M9.5 10.5h5"/></svg>
      </button>
    </div>

    <div class="tabs" role="tablist" aria-label="Conversation categories">
      <button class="tab" type="button" role="tab" data-tab="chats" aria-selected="true">Chats</button>
      <button class="tab" type="button" role="tab" data-tab="groups" aria-selected="false">Groups</button>
      <button class="tab" type="button" role="tab" data-tab="clubs" aria-selected="false">Club Groups</button>
    </div>

    <div class="search-row">
      <label class="search">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="search" type="search" placeholder="Search messages, people, groups..." aria-label="Search messages, people, groups" autocomplete="off">
      </label>
      <button class="filter-btn" id="archivedBtn" type="button" aria-pressed="false" aria-label="Show archived conversations" title="Archived conversations">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 4h18l-1 6H4z"/><path d="M5 10v9h14v-9"/><path d="M10 14h4"/></svg>
      </button>
    </div>

    <div class="chips" role="group" aria-label="Filter conversations">
      <button class="chip" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="chip" type="button" data-filter="unread" aria-pressed="false">Unread</button>
      <button class="chip" type="button" data-filter="faculty" aria-pressed="false">Faculty</button>
      <button class="chip" type="button" data-filter="students" aria-pressed="false">Students</button>
      <button class="chip" type="button" data-filter="groups" aria-pressed="false">Groups</button>
      <button class="chip chip-icon" id="sortBtn" type="button" aria-pressed="false" aria-label="Sort by unread first" title="Sort by unread first">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 16l4 4 4-4"/><path d="M17 20V4M13 8l4-4 4 4"/></svg>
      </button>
    </div>

    <p class="state" id="archivedNote" hidden>Showing archived conversations. <button class="link-btn" id="archivedExit" type="button">Back to inbox</button></p>
    <p class="state" id="inboxStatus" role="status" aria-live="polite" hidden></p>

    <section id="listArea" aria-live="polite"><div class="state">Loading conversations...</div></section>
    <section id="matchArea"></section>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <button class="nav-item" type="button" data-nav="dashboard.html">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" type="button" data-nav="messages.html" aria-current="page">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Messages</span>
      <span class="nav-badge" id="navBadge" hidden></span>
    </button>
    <button class="nav-item" type="button" data-nav="attendance.html">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Attendance</span>
    </button>
    <button class="nav-item" type="button" data-nav="profile.html">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span>Profile</span>
    </button>
  </nav>
</div>

<dialog class="dialog" id="newDialog" aria-labelledby="newDialogTitle">
  <div class="dialog-inner">
    <div class="dialog-head">
      <h2 id="newDialogTitle">New message</h2>
      <button class="icon-btn" id="closeDialog" type="button" aria-label="Close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <label class="search compact">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="dialogSearch" type="search" placeholder="Search people or groups" aria-label="Search people or groups" autocomplete="off">
    </label>
    <div class="dialog-body" id="dialogBody"></div>
  </div>
</dialog>

<script src="/socket.io/socket.io.js"></script>
<script>
const token=sessionStorage.getItem('token')||localStorage.getItem('token');
if(!token)location.href='login.html';
const auth={Authorization:'Bearer '+token};
const $=id=>document.getElementById(id);
const ROLE_LABELS={student:'Student',organizer:'Organizer',hod:'HOD',super_admin:'Admin'};
const GROUP_TYPES_BY_TAB={groups:['academic','official'],clubs:['community']};
const PALETTE=['#e11d48','#7c3aed','#059669','#ea580c','#0ea5e9','#db2777','#4f46e5','#16a34a'];
const state={tab:'chats',filter:'all',sort:'latest',archived:false,q:'',conversations:[],listError:null,groups:[],groupsError:null,loadSeq:0};

async function call(url,opt={}){
  const r=await fetch(API_BASE+url,{...opt,headers:{...auth,...(opt.headers||{})}});
  const d=await r.json().catch(()=>({}));
  if(r.status===401){localStorage.removeItem('token');sessionStorage.removeItem('token');location.href='login.html';throw new Error('Session expired')}
  if(!r.ok)throw new Error(d.message||'Request failed ('+r.status+')');
  return d;
}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function initials(name){const parts=String(name||'').trim().split(/\s+/).filter(Boolean);if(!parts.length)return '?';return (parts[0][0]+(parts.length>1?parts[parts.length-1][0]:'')).toUpperCase()}
function colorFor(text){let h=0;for(const ch of String(text))h=(h*31+ch.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}
const GROUP_ICON='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M3 19a6 6 0 0 1 12 0M15 19a4.5 4.5 0 0 1 6 0"/></svg>';
const MUTE_ICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Muted"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>';
const PIN_ICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-label="Pinned"><path d="M16 3l5 5-2 1-3 3 1 4-2 2-3-3-5 5-1-1 5-5-3-3 2-2 4 1 3-3 1-2z"/></svg>';

function formatTime(iso){
  if(!iso)return '';
  const d=new Date(iso);
  const now=new Date();
  if(d.toDateString()===now.toDateString())return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  const yesterday=new Date(now);yesterday.setDate(now.getDate()-1);
  if(d.toDateString()===yesterday.toDateString())return 'Yesterday';
  return d.toLocaleDateString([],{day:'numeric',month:'short'});
}
function errorBlock(message,retryAttr){return '<div class="state error" role="alert"><p>'+esc(message)+'</p><button class="ghost retry" type="button" '+retryAttr+'>Retry</button></div>'}
function setStatus(message,isError){const el=$('inboxStatus');el.textContent=message;el.hidden=!message;el.className='state'+(isError?' error':'')}
function threadUrl(id){return 'messages-thread.html?id='+encodeURIComponent(id)}

function avatarHtml(item){
  if(item.conversation_type==='direct'){
    const name=item.peer_name||'Direct';
    return '<span class="avatar" style="background:'+colorFor(name)+'">'+esc(initials(name))+'</span>';
  }
  const color=item.group_type==='community'?'#7c3aed':item.group_type==='official'?'#ea580c':'#1565e8';
  return '<span class="avatar group" style="background:'+color+'">'+GROUP_ICON+'</span>';
}
function conversationRow(item){
  const title=item.conversation_type==='direct'?(item.peer_name||'Direct conversation'):(item.group_name||'Group conversation');
  const preview=item.last_message||'No messages yet';
  const unread=Number(item.unread_count)||0;
  return '<li><a class="row" href="'+threadUrl(item.id)+'">'
    +avatarHtml(item)
    +'<span class="row-body"><span class="row-title">'+esc(title)+'</span><span class="row-preview">'+esc(preview)+'</span></span>'
    +'<span class="row-meta"><span class="row-time">'+esc(formatTime(item.last_message_at||item.created_at))+'</span>'
    +'<span class="row-icons">'+(item.is_muted?MUTE_ICON:'')+(item.is_pinned?PIN_ICON:'')+(unread?'<span class="count" aria-label="'+unread+' unread">'+(unread>99?'99+':unread)+'</span>':'')+'</span></span>'
    +'</a></li>';
}
function joinableRow(group){
  const color=group.group_type==='community'?'#7c3aed':group.group_type==='official'?'#ea580c':'#1565e8';
  return '<li class="row" style="cursor:default">'
    +'<span class="avatar group" style="background:'+color+'">'+GROUP_ICON+'</span>'
    +'<span class="row-body"><span class="row-title">'+esc(group.name)+'</span><span class="row-preview">'+esc(group.group_type)+' · '+esc(group.member_count)+' members</span></span>'
    +'<button class="join-pill" type="button" data-join="'+esc(group.id)+'">Join</button>'
    +'</li>';
}
function joinableGroups(){
  const types=GROUP_TYPES_BY_TAB[state.tab];
  if(!types||state.archived||!(state.filter==='all'||state.filter==='groups'))return [];
  const q=state.q.toLowerCase();
  return state.groups.filter(g=>!g.is_member&&types.includes(g.group_type)&&(!q||String(g.name).toLowerCase().includes(q)));
}

function renderList(){
  const area=$('listArea');
  if(state.listError){area.innerHTML=errorBlock('Could not load conversations: '+state.listError,'data-retry-list');return}
  let html='';
  if(state.conversations.length){
    html+='<ul class="list">'+state.conversations.map(conversationRow).join('')+'</ul>';
  }else{
    const empty=state.q?'No conversations match your search.':state.archived?'No archived conversations.':'No conversations in this view yet.';
    html+='<div class="state">'+esc(empty)+'</div>';
  }
  const joinable=joinableGroups();
  if(state.groupsError){
    html+=errorBlock('Could not load groups: '+state.groupsError,'data-retry-groups');
  }else if(joinable.length){
    html+='<div class="section-label">Join groups</div><ul class="list">'+joinable.map(joinableRow).join('')+'</ul>';
  }
  area.innerHTML=html;
}

async function loadConversations(){
  const seq=++state.loadSeq;
  const params=new URLSearchParams({tab:state.tab,limit:'100'});
  if(state.filter!=='all')params.set('filter',state.filter);
  if(state.sort==='unread')params.set('sort','unread');
  if(state.archived)params.set('archived','1');
  if(state.q)params.set('q',state.q);
  try{
    const d=await call('/api/messages/conversations?'+params);
    if(seq!==state.loadSeq)return;
    state.conversations=d.items||[];
    state.listError=null;
  }catch(e){
    if(seq!==state.loadSeq)return;
    state.conversations=[];
    state.listError=e.message;
  }
  renderList();
}
async function loadGroups(){
  try{
    const d=await call('/api/messages/groups?limit=100');
    state.groups=d.items||[];
    state.groupsError=null;
  }catch(e){
    state.groupsError=e.message;
  }
  renderList();
}
async function loadUnread(){
  try{
    const d=await call('/api/messages/unread-count');
    const total=Number(d.unread_count)||0;
    const label=total>99?'99+':String(total);
    for(const el of [$('bellBadge'),$('navBadge')]){el.textContent=label;el.hidden=total===0}
  }catch(e){
    setStatus('Could not load unread count: '+e.message,true);
  }
}
async function loadMatches(){
  const area=$('matchArea');
  if(state.q.length<2){area.innerHTML='';return}
  try{
    const d=await call('/api/messages/search?q='+encodeURIComponent(state.q));
    const items=d.items||[];
    area.innerHTML='<div class="section-label">Messages</div>'+(items.length
      ?'<ul class="list">'+items.map(m=>'<li><a class="row" href="'+threadUrl(m.conversation_id)+'"><span class="avatar" style="background:'+colorFor(m.sender_name)+'">'+esc(initials(m.sender_name))+'</span><span class="row-body"><span class="row-title">'+esc(m.group_name||m.sender_name)+'</span><span class="row-preview">'+esc(m.sender_name)+': '+esc(m.body)+'</span></span><span class="row-meta"><span class="row-time">'+esc(formatTime(m.created_at))+'</span></span></a></li>').join('')+'</ul>'
      :'<div class="state">No messages match your search.</div>');
  }catch(e){
    area.innerHTML=errorBlock('Could not search messages: '+e.message,'data-retry-matches');
  }
}
async function refreshAll(){await Promise.all([loadConversations(),loadUnread(),loadMatches()])}

function syncChipsForTab(){
  const chatsOnly=state.tab==='chats';
  document.querySelectorAll('[data-filter="faculty"],[data-filter="students"]').forEach(b=>{b.disabled=!chatsOnly});
  if(!chatsOnly&&(state.filter==='faculty'||state.filter==='students'))state.filter='all';
  document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.filter===state.filter?'true':'false'));
}

document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{
  state.tab=b.dataset.tab;
  document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b?'true':'false'));
  syncChipsForTab();
  setStatus('');
  loadConversations();
}));
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{
  if(b.disabled)return;
  state.filter=b.dataset.filter;
  syncChipsForTab();
  setStatus('');
  loadConversations();
}));
$('sortBtn').addEventListener('click',()=>{
  state.sort=state.sort==='unread'?'latest':'unread';
  $('sortBtn').setAttribute('aria-pressed',state.sort==='unread'?'true':'false');
  loadConversations();
});
$('archivedBtn').addEventListener('click',()=>{
  state.archived=!state.archived;
  $('archivedBtn').setAttribute('aria-pressed',state.archived?'true':'false');
  $('archivedNote').hidden=!state.archived;
  loadConversations();
});
$('archivedExit').addEventListener('click',()=>$('archivedBtn').click());
$('bellBtn').addEventListener('click',()=>{
  state.filter='unread';
  syncChipsForTab();
  loadConversations();
});

let searchTimer=null;
$('search').addEventListener('input',()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    state.q=$('search').value.trim();
    loadConversations();
    loadMatches();
  },300);
});

$('listArea').addEventListener('click',async e=>{
  if(e.target.closest('[data-retry-list]')){loadConversations();return}
  if(e.target.closest('[data-retry-groups]')){loadGroups();return}
  const join=e.target.closest('[data-join]');
  if(!join)return;
  join.disabled=true;
  try{
    const d=await call('/api/messages/groups/'+join.dataset.join+'/join',{method:'POST'});
    setStatus('Joined group.');
    await Promise.all([loadGroups(),loadConversations(),loadUnread()]);
    if(d.conversation_id)location.href=threadUrl(d.conversation_id);
  }catch(err){
    join.disabled=false;
    setStatus(err.message,true);
  }
});
$('matchArea').addEventListener('click',e=>{if(e.target.closest('[data-retry-matches]'))loadMatches()});

const dialog=$('newDialog');
$('newMessageBtn').addEventListener('click',()=>{
  dialog.showModal();
  $('dialogSearch').value='';
  renderDialogHint();
  $('dialogSearch').focus();
});
$('closeDialog').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});

function renderDialogHint(){$('dialogBody').innerHTML='<div class="state">Type at least 2 characters to find eligible people and groups.</div>'}
let dialogSeq=0,dialogTimer=null;
$('dialogSearch').addEventListener('input',()=>{
  clearTimeout(dialogTimer);
  dialogTimer=setTimeout(runDialogSearch,300);
});
async function runDialogSearch(){
  const q=$('dialogSearch').value.trim();
  const seq=++dialogSeq;
  if(q.length<2){renderDialogHint();return}
  const body=$('dialogBody');
  body.innerHTML='<div class="state">Searching...</div>';
  const people=await call('/api/messages/recipients?q='+encodeURIComponent(q)).then(value=>({ok:true,value}),error=>({ok:false,error}));
  if(seq!==dialogSeq)return;
  let html='';
  if(people.ok){
    const items=people.value.items||[];
    html+='<div class="section-label">People</div>'+(items.length
      ?'<ul class="list">'+items.map(p=>'<li class="row" style="cursor:default"><span class="avatar" style="background:'+colorFor(p.name)+'">'+esc(initials(p.name))+'</span><span class="row-body"><span class="row-title">'+esc(p.name)+'</span><span class="row-preview">'+esc(ROLE_LABELS[p.role]||p.role)+(p.department_name?' · '+esc(p.department_name):'')+'</span></span><button class="join-pill" type="button" data-message="'+esc(p.id)+'">Message</button></li>').join('')+'</ul>'
      :'<div class="state">No eligible people found.</div>');
  }else{
    html+=errorBlock('Could not search people: '+people.error.message,'data-retry-dialog');
  }
  const matches=state.groups.filter(g=>String(g.name).toLowerCase().includes(q.toLowerCase()));
  if(matches.length){
    html+='<div class="section-label">Groups</div><ul class="list">'+matches.map(g=>'<li class="row" style="cursor:default"><span class="avatar group" style="background:#1565e8">'+GROUP_ICON+'</span><span class="row-body"><span class="row-title">'+esc(g.name)+'</span><span class="row-preview">'+esc(g.group_type)+' · '+esc(g.member_count)+' members</span></span>'+(g.is_member&&g.conversation_id?'<button class="join-pill" type="button" data-open-conversation="'+esc(g.conversation_id)+'">Open</button>':'<button class="join-pill" type="button" data-join-dialog="'+esc(g.id)+'">Join</button>')+'</li>').join('')+'</ul>';
  }
  body.innerHTML=html;
}
$('dialogBody').addEventListener('click',async e=>{
  if(e.target.closest('[data-retry-dialog]')){runDialogSearch();return}
  const message=e.target.closest('[data-message]');
  const open=e.target.closest('[data-open-conversation]');
  const join=e.target.closest('[data-join-dialog]');
  try{
    if(message){
      message.disabled=true;
      const d=await call('/api/messages/direct',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target_id:Number(message.dataset.message)})});
      location.href=threadUrl(d.id);
    }else if(open){
      location.href=threadUrl(open.dataset.openConversation);
    }else if(join){
      join.disabled=true;
      const d=await call('/api/messages/groups/'+join.dataset.joinDialog+'/join',{method:'POST'});
      location.href=threadUrl(d.conversation_id);
    }
  }catch(err){
    const note=document.createElement('div');
    note.className='state error';
    note.setAttribute('role','alert');
    note.textContent=err.message;
    $('dialogBody').prepend(note);
    if(message)message.disabled=false;
    if(join)join.disabled=false;
  }
});

$('topBack').addEventListener('click',()=>location.href='dashboard.html');
$('sheetBack').addEventListener('click',()=>location.href='dashboard.html');
$('topAvatar').addEventListener('click',()=>location.href='profile.html');
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{location.href=b.dataset.nav}));

function connectRealtime(){
  if(typeof io!=='function')return;
  const socket=io(API_BASE,{auth:{token},transports:['websocket','polling']});
  let timer=null;
  const refresh=()=>{clearTimeout(timer);timer=setTimeout(refreshAll,400)};
  socket.on('conversation:updated',refresh);
  socket.on('message:new',refresh);
  socket.on('connect_error',()=>setStatus('Live updates unavailable. Showing saved conversations.',true));
  socket.on('connect',()=>{if($('inboxStatus').classList.contains('error'))setStatus('')});
  window.addEventListener('beforeunload',()=>socket.disconnect());
}

async function boot(){
  try{
    const me=await call('/api/auth/me');
    const name=me.name||me.profile?.name||'';
    if(name)$('topAvatar').textContent=initials(name);
    state.profile=me;
  }catch(e){
    setStatus('Could not load your profile: '+e.message,true);
  }
  syncChipsForTab();
  await Promise.all([loadConversations(),loadGroups(),loadUnread()]);
  connectRealtime();
}
boot();
</script>
</body>
