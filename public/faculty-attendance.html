<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faculty attendance · Campus ERP</title><link rel="stylesheet" href="erp-ui.css">
<style>
:root{--ink:#172033;--muted:#68758a;--line:#e4e9f2;--surface:#fff;--canvas:#f5f7fb;--blue:#315efb;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,system-ui,sans-serif}.shell{max-width:1280px;margin:auto;padding:28px clamp(16px,4vw,54px)}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.top h1{margin:0}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 30px #19315b0d;margin-bottom:18px}.filters,.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.field{display:grid;gap:5px;flex:1 1 170px}.field label{font-size:12px;font-weight:700;color:var(--muted)}input,select,button{font:inherit;padding:10px 12px;border:1px solid #ccd5e5;border-radius:9px}button{cursor:pointer;border:0;background:var(--blue);color:#fff;font-weight:700}.secondary{background:#e8edff;color:#2449d8}.danger{color:var(--red)}.message{color:var(--muted);margin-top:12px}.table-wrap{overflow:auto;margin-top:18px}table{border-collapse:collapse;width:100%;min-width:780px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);text-transform:uppercase}.status{font-weight:700}@media(max-width:650px){.top{display:block}.top button{margin-top:12px;width:100%}.card{padding:14px}}
</style></head><body><main class="shell"><header class="top"><div><p style="color:var(--blue);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12px">Workforce</p><h1>Faculty attendance &amp; workload</h1><p style="color:var(--muted)">Leave balances and holiday policies are not configured in this installation.</p></div><button class="secondary" onclick="history.back()">Back</button></header>
<section class="card"><h2>Record attendance</h2><div class="filters"><div class="field"><label for="faculty">Faculty ID</label><input id="faculty" type="number" min="1" placeholder="Your ID or managed faculty"></div><div class="field"><label for="date">Date</label><input id="date" type="date"></div><div class="field"><label for="status">Status</label><select id="status"><option>Present</option><option>Absent</option><option>Late</option><option>On Leave</option></select></div><div class="field"><label for="checkIn">Check-in</label><input id="checkIn" type="datetime-local"></div><div class="field"><label for="checkOut">Check-out</label><input id="checkOut" type="datetime-local"></div><div class="field"><label for="notes">Notes</label><input id="notes" maxlength="500"></div><button onclick="saveAttendance()">Save attendance</button></div><p id="message" class="message"></p></section>
<section class="card"><h2>Attendance history</h2><div class="filters"><div class="field"><label for="from">From</label><input id="from" type="date"></div><div class="field"><label for="to">To</label><input id="to" type="date"></div><div class="field"><label for="filterFaculty">Faculty ID</label><input id="filterFaculty" type="number" min="1"></div><button class="secondary" onclick="loadHistory()">Load history</button><button class="secondary" onclick="downloadCsv()">Export CSV</button></div><div id="history" class="table-wrap"></div></section>
<section class="card"><h2>Reports</h2><div class="actions"><button class="secondary" onclick="loadSummary()">Monthly summary</button><button class="secondary" onclick="loadWorkload()">Workload summary</button><button class="secondary" onclick="loadDailyWorkload()">Classes by weekday</button></div><div id="report" class="table-wrap"></div></section></main>
<script src="config.js"></script><script>
const token=localStorage.getItem('token');const role=localStorage.getItem('role');const auth={Authorization:'Bearer '+token};const $=id=>document.getElementById(id);const msg=text=>$('message').textContent=text;
async function call(url,options={}){const res=await fetch(API_BASE+url,{...options,headers:{...auth,'Content-Type':'application/json',...(options.headers||{})}});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||'Request failed');return data}
function params(){const p=new URLSearchParams();[['from','from'],['to','to'],['filterFaculty','faculty_id']].forEach(([a,b])=>{if($(a).value)p.set(b,$(a).value)});return p.toString()?`?${p}`:''}
async function saveAttendance(){try{const payload={attendance_date:$('date').value,status:$('status').value,check_in:$('checkIn').value||null,check_out:$('checkOut').value||null,notes:$('notes').value||null};await call('/api/faculty-attendance/'+$('faculty').value,{method:'POST',body:JSON.stringify(payload)});msg('Attendance saved.');loadHistory()}catch(e){msg(e.message)}}
async function loadHistory(){try{const data=await call('/api/faculty-attendance/'+params());$('history').innerHTML='<table><thead><tr><th>Date</th><th>Faculty</th><th>Status</th><th>Check-in</th><th>Check-out</th><th>Notes</th></tr></thead><tbody>'+data.items.map(r=>`<tr><td>${r.attendance_date}</td><td>${r.faculty_name}</td><td class="status">${r.status}</td><td>${r.check_in||'—'}</td><td>${r.check_out||'—'}</td><td>${r.notes||'—'}</td></tr>`).join('')+'</tbody></table>'}catch(e){$('history').innerHTML=`<p class="danger">${e.message}</p>`}}
function table(headers,rows){$('report').innerHTML='<table><thead><tr>'+headers.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+rows+'</tbody></table>'}
async function loadSummary(){try{const data=await call('/api/faculty-attendance/reports/monthly'+params());table(['Faculty','Total days','Present','Absent','Late','Leave','Percentage'],data.items.map(r=>`<tr><td>${r.faculty_name}</td><td>${r.total_days}</td><td>${r.present_days}</td><td>${r.absent_days}</td><td>${r.late_days}</td><td>${r.leave_days}</td><td>${r.attendance_percentage??'—'}%</td></tr>`))}catch(e){$('report').innerHTML=`<p class="danger">${e.message}</p>`}}
async function loadWorkload(){try{const data=await call('/api/faculty-attendance/reports/workload'+params());table(['Faculty','Classes','Subjects','Sections','Scheduled hours','Subject names','Sections'],data.items.map(r=>`<tr><td>${r.faculty_name}</td><td>${r.scheduled_classes}</td><td>${r.subjects}</td><td>${r.sections}</td><td>${r.scheduled_hours}</td><td>${r.subject_names||'—'}</td><td>${r.section_names||'—'}</td></tr>`))}catch(e){$('report').innerHTML=`<p class="danger">${e.message}</p>`}}
async function loadDailyWorkload(){try{const data=await call('/api/faculty-attendance/reports/workload/daily'+params());table(['Faculty','Weekday','Classes','Scheduled hours','Subjects','Sections'],data.items.map(r=>`<tr><td>${r.faculty_name}</td><td>${r.weekday}</td><td>${r.scheduled_classes}</td><td>${r.scheduled_hours}</td><td>${r.subject_names||'—'}</td><td>${r.section_names||'—'}</td></tr>`))}catch(e){$('report').innerHTML=`<p class="danger">${e.message}</p>`}}
async function downloadCsv(){const res=await fetch(API_BASE+'/api/faculty-attendance/export.csv'+params(),{headers:auth});if(!res.ok){msg('Export failed');return}const blob=await res.blob();const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='faculty-attendance.csv';link.click();URL.revokeObjectURL(link.href)}
if(!token)location.href='login.html';
</script></body></html>
