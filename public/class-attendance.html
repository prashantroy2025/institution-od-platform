<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class attendance · Campus ERP</title>
<link rel="stylesheet" href="erp-ui.css">
<style>
:root{--ink:#172033;--muted:#68758a;--line:#e4e9f2;--surface:#fff;--canvas:#f5f7fb;--navy:#101b35;--blue:#315efb;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,system-ui,sans-serif}.shell{max-width:1200px;margin:auto;padding:28px clamp(16px,4vw,54px)}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.top h1{margin:0}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 30px #19315b0d}.filters,.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.field{display:grid;gap:5px;flex:1 1 180px}.field label{font-size:12px;font-weight:700;color:var(--muted)}input,select,button{font:inherit;padding:10px 12px;border:1px solid #ccd5e5;border-radius:9px}button{cursor:pointer;border:0;background:var(--blue);color:#fff;font-weight:700}.secondary{background:#e8edff;color:#2449d8}.danger{color:var(--red)}.table-wrap{overflow:auto;margin-top:18px}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);text-transform:uppercase}.status{font-weight:700}.message{margin-top:14px;color:var(--muted)}@media(max-width:650px){.top{display:block}.top button{margin-top:12px;width:100%}.card{padding:14px}}
</style></head><body><main class="shell"><header class="top"><div><p style="color:var(--blue);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12px">Academics</p><h1>Class attendance</h1><p style="color:var(--muted)">Separate from event QR attendance.</p></div><button class="secondary" onclick="history.back()">Back</button></header>
<section class="card"><div class="filters"><div class="field"><label for="timetable">Timetable ID</label><input id="timetable" type="number" min="1" placeholder="Assigned timetable"></div><div class="field"><label for="date">Class date</label><input id="date" type="date"></div><button onclick="loadSession()">Load class</button></div><div id="message" class="message">Faculty/HOD: load a timetable to mark attendance. Students: load a timetable to view your own record.</div><div id="roster" class="table-wrap"></div></section>
<section class="card" style="margin-top:18px"><div class="filters"><div class="field"><label for="historyDate">History date</label><input id="historyDate" type="date"></div><button class="secondary" onclick="loadHistory()">Load history</button><button class="secondary" onclick="loadReport()">Shortage report</button></div><div id="results" class="table-wrap"></div></section></main>
<script src="config.js"></script><script>
const token=sessionStorage.getItem('token')||localStorage.getItem('token'); const role=sessionStorage.getItem('role')||localStorage.getItem('role'); const auth={Authorization:'Bearer '+token}; const $=id=>document.getElementById(id); const message=text=>$('message').textContent=text;
async function call(url,options={}){const res=await fetch(API_BASE+url,{...options,headers:{...auth,'Content-Type':'application/json',...(options.headers||{})}});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||'Request failed');return data}
async function loadSession(){try{const data=await call('/api/class-attendance/timetable/'+$('timetable').value+'/'+$('date').value);message(data.timetable.subject_name+' · Section '+data.timetable.section_name);$('roster').innerHTML='<table><thead><tr><th>Student</th><th>Enrollment</th><th>Status</th></tr></thead><tbody>'+data.students.map((s,i)=>'<tr><td>'+s.name+'</td><td>'+(s.enrollment_no||s.college_id||'—')+'</td><td><select data-student="'+s.id+'" '+(role==='student'?'disabled':'')+'>'+['Present','Absent','Late','Excused'].map(v=>'<option '+(s.status===v?'selected':'')+'>'+v+'</option>').join('')+'</select></td></tr>').join('')+'</tbody></table>'+(role!=='student'?'<div class="actions" style="margin-top:14px"><button onclick="save()">Save attendance</button></div>':'')}catch(e){message(e.message);$('roster').innerHTML=''} }
async function save(){const records=[...document.querySelectorAll('[data-student]')].map(el=>({student_id:Number(el.dataset.student),status:el.value}));try{await call('/api/class-attendance/timetable/'+$('timetable').value,{method:'POST',body:JSON.stringify({attendance_date:$('date').value,records})});message('Attendance saved.');await loadSession()}catch(e){message(e.message)}}
async function loadHistory(){try{const q=$('historyDate').value?'?date='+encodeURIComponent($('historyDate').value):'';const data=await call('/api/class-attendance/history'+q);$('results').innerHTML='<table><thead><tr><th>Date</th><th>Student</th><th>Subject</th><th>Status</th></tr></thead><tbody>'+data.items.map(r=>'<tr><td>'+r.attendance_date+'</td><td>'+r.student_name+'</td><td>'+r.subject_name+'</td><td class="status">'+r.status+'</td></tr>').join('')+'</tbody></table>'}catch(e){$('results').innerHTML='<p class="danger">'+e.message+'</p>'}}
async function loadReport(){try{const data=await call('/api/class-attendance/reports/shortage');$('results').innerHTML='<table><thead><tr><th>Student</th><th>Total</th><th>Attended</th><th>Percentage</th><th>Result</th></tr></thead><tbody>'+data.items.map(r=>'<tr><td>'+r.name+'</td><td>'+r.total_classes+'</td><td>'+r.attended+'</td><td>'+r.attendance_percentage+'%</td><td class="'+(r.shortage?'danger':'status')+'">'+(r.shortage?'Shortage':'Healthy')+'</td></tr>').join('')+'</tbody></table>'}catch(e){$('results').innerHTML='<p class="danger">'+e.message+'</p>'}}
if(!token){location.href='login.html'}
</script></body></html>
